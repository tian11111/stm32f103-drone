# DAPLink / CMSIS-DAP —— 遥控器 STM32F103C8T6
#
# 探头: jixin.pro CMSIS-DAP_LU, USB\VID_C251&PID_F001, 序列号 LU_2022_8888
# 该探头 nRESET 引脚未引出到目标板，因此不挂硬件复位线（reset_config none）。
#
# 注意: adapter speed 必须写在 target cfg 之后，
#       stm32f1x.cfg 内部第 65 行自带 "adapter speed 1000"，写在前面会被覆盖。

source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0xc251 0xf001
transport select swd
source [find target/stm32f1x.cfg]

# 10 MHz。F103 上 SWD 跑 10M 一般可用；若出现 "No ACK" 或校验失败，
# 依次降到 4000 / 2000 / 1000 再试（长杜邦线尤其需要降速）。
adapter speed 10000

reset_config none
