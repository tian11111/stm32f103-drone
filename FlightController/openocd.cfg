# DAPLink / CMSIS-DAP -- FlightController STM32F103C8T6
source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0xc251 0xf001
transport select swd
source [find target/stm32f1x.cfg]

# Keep this after the target script. Try 5 MHz; fall back to 1000 if unstable.
adapter speed 5000
reset_config none
# Reset through SWD when the probe has no physical nRESET connection.
cortex_m reset_config sysresetreq
